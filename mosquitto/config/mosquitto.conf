# Argus Mosquitto, DEV. Plain MQTT on 1883 inside Docker, published on the
# host as 127.0.0.1:1885 (1883 is taken by the water stack). Production adds
# a TLS listener on 8883 (see the deploy files, built later).
#
# Who may connect and which topics they may use is decided by OUR backend:
# the go-auth plugin asks http://backend:3100/mqtt/user and /mqtt/acl
# (backend/src/routes/mqttAuth.js). 200 = allow, anything else = deny.

per_listener_settings false
allow_anonymous false

listener 1883 0.0.0.0

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Same limits as the water project's production broker.
max_keepalive 300
max_queued_messages 200
message_size_limit 4096

# ---- go-auth: HTTP backend --------------------------------------------
auth_plugin /mosquitto/go-auth.so
auth_opt_log_level warn
auth_opt_backends http
auth_opt_http_host backend
auth_opt_http_port 3100
auth_opt_http_getuser_uri /mqtt/user
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_with_tls false
auth_opt_http_timeout 5
auth_opt_http_response_mode status
auth_opt_http_params_mode json
# No superusers: even the backend's own MQTT user goes through the ACL hook.
auth_opt_disable_superuser true

# Cache answers so the backend isn't asked on every single message.
# Login answers 2 s, topic answers 60 s (same as the water project).
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 2
auth_opt_acl_cache_seconds 60
auth_opt_auth_jitter_seconds 0
auth_opt_acl_jitter_seconds 0
