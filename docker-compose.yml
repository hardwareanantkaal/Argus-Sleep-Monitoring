# Argus DEV stack. Ports avoid the water and magic-outline stacks,
# which already use 3000, 1883, 5432, 5433 and 5050 on this PC.
#   backend   127.0.0.1:3100
#   postgres  127.0.0.1:5434
#   mosquitto 127.0.0.1:1885  (plain MQTT, dev only; production adds TLS 8883)
name: argus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus} -d ${POSTGRES_DB:-argus}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus}@postgres:5432/${POSTGRES_DB:-argus}
      MIGRATIONS_DIR: /app/database/migrations
      BACKEND_PORT: 3100
      LOG_LEVEL: debug
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME:-argus-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-dev-only-mqtt-password}
      OTA_DIR: /srv/ota
      FW_BASE_URL: http://localhost:3100
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/scripts:/app/backend/scripts
      - ./database/migrations:/app/database/migrations:ro
      - otadata:/srv/ota
    depends_on:
      postgres:
        condition: service_healthy

  # The broker asks the backend (/mqtt/user, /mqtt/acl) who may log in and
  # which topics they may use. If the backend is down, new logins are refused
  # until it's back; the backend's MQTT client reconnects by itself.
  mosquitto:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    ports:
      - "127.0.0.1:1885:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    depends_on:
      - backend

volumes:
  pgdata:
  mqttdata:
  otadata:
