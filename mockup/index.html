<title>Argus Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one app shell. Desktop = full sidebar, tablet = icon rail, phone = bottom tab bar.
   Dark night palette is the default; light theme only when chosen. */
:root{
  --bg:#0a0f1f; --panel:#111a2e; --panel-2:#18233d; --line:#25314f; --ink:#e7ebf6; --muted:#8c97b6;
  --accent:#93a8ff; --accent-ink:#0a0f1f; --accent-soft:rgba(147,168,255,.14);
  --live:#4fd6bd; --live-soft:rgba(79,214,189,.14);
  --ok:#4cd38a; --ok-soft:rgba(76,211,138,.14); --warn:#f2b45c; --warn-soft:rgba(242,180,92,.15); --bad:#ff7a7a; --bad-soft:rgba(255,122,122,.15);
  --st-deep:#5468e0; --st-light:#93a8ff; --st-awake:#f2b45c;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --bar:52px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f4fb; --panel:#ffffff; --panel-2:#eaeef8; --line:#d9dfee; --ink:#121831; --muted:#58628a;
  --accent:#3b52d1; --accent-ink:#ffffff; --accent-soft:rgba(59,82,209,.1);
  --live:#0b937c; --live-soft:rgba(11,147,124,.1);
  --ok:#17834c; --ok-soft:rgba(23,131,76,.1); --warn:#a35f00; --warn-soft:rgba(163,95,0,.1); --bad:#c8352d; --bad-soft:rgba(200,53,45,.1);
  --st-deep:#3346b8; --st-light:#8193ee; --st-awake:#e09a35;
  --shadow:0 10px 30px rgba(20,30,70,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:clamp(22px,2.6vw,28px);line-height:1.2}
h2{font-size:17px} h3{font-size:15px}
p{margin:0}
a,.link{color:var(--accent);cursor:pointer;text-decoration:none;background:none;border:0;padding:0;font:inherit}
a:hover,.link:hover{text-decoration:underline}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)} .small{font-size:13.5px} .xs{font-size:12px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.i{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.demobar .in{display:flex;align-items:center;gap:12px;height:var(--bar);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.03em;color:var(--ink)}
.brand svg{color:var(--accent)}
.mock-tag{font-size:11.5px;font-weight:600;color:var(--warn);border:1px dashed var(--warn);border-radius:999px;padding:2px 10px;white-space:nowrap}
.sp{flex:1}
.demobar select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:inherit;font-size:13.5px;max-width:52vw}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.iconbtn:hover{background:var(--panel-2)}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - var(--bar))}
.side{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));align-self:start;border-right:1px solid var(--line);padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;overflow:auto}
.side .sec{margin:2px 11px 8px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink);font:inherit;font-weight:500;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.nav:hover{background:var(--panel-2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:10px}
.who b{display:block;font-weight:600}
.main{padding-block:26px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
@media (min-width:720px){.main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.narrow{max-width:760px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.crumb{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;background:none;border:0;padding:0;align-self:flex-start}
.crumb:hover{color:var(--ink)}
.tabbar{display:none}

@media (min-width:720px) and (max-width:1099px){
  .shell{grid-template-columns:88px minmax(0,1fr)}
  .side{padding:14px 8px;padding-left:max(8px,env(safe-area-inset-left,0px))}
  .nav{flex-direction:column;gap:5px;font-size:11.5px;padding:10px 4px;text-align:center;line-height:1.2}
  .side .sec,.side .who{display:none}
  .side .foot{padding:12px 0 0;align-items:center}
  .side .foot .btn{padding:6px 8px;font-size:11.5px}
}
@media (max-width:719px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-bottom:110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  .tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabbar button.on{color:var(--accent)}
  .mock-tag{display:none}
}

/* sheet (phone "More") */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:10px 0 calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}

/* blocks */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch .t{display:flex;flex-direction:column;gap:2px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
@media (max-width:1099px){.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:719px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.tile .v{font-size:25px}.card{padding:16px}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.divider{height:1px;background:var(--line);margin:4px 0}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.live{background:var(--live-soft);color:var(--live)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ph{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.04em;color:var(--warn);border:1px dashed currentColor;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle;text-transform:uppercase;line-height:1.6}
body.noph .ph{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2);filter:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}
.btn.sm{padding:5px 11px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-height:42px}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.inp.sm{min-height:34px;padding:5px 9px;width:auto}
.hint{font-size:12.5px;color:var(--muted)}
.phone{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px}
.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.fields2{grid-template-columns:minmax(0,1fr)}}

.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(16px);background:var(--accent-ink)}
.sw:disabled{opacity:.5;cursor:not-allowed}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog .t{display:flex;flex-direction:column;min-width:0}

.seg{display:inline-flex;background:var(--panel-2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}

.tbl{overflow-x:auto;margin:0 -18px -18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp{width:auto;flex:1 1 180px}
.toolbar select.inp{flex:0 1 170px}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}

/* devices */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.dcard{display:flex;flex-direction:column;gap:14px}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vital{background:var(--panel-2);border-radius:12px;padding:10px 12px;min-width:0}
.vital b{font-family:var(--display);font-size:20px;font-weight:600;display:block;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vital span{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:34px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

/* live */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.metrics{grid-template-columns:minmax(0,1fr)}}
.metric{display:flex;flex-direction:column;gap:6px}
.metric .top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;font-weight:600}
.metric .big{font-family:var(--display);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metric .big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:0}
.spark{width:100%;height:46px;display:block}
.meter{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--live);border-radius:4px;transition:width .6s}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);background:var(--panel-2);border-radius:12px;padding:12px 14px}

/* sleep */
.sbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--panel-2);min-width:120px}
.sbar i{display:block;height:100%}
.c-deep{background:var(--st-deep)} .c-light{background:var(--st-light)} .c-awake{background:var(--st-awake)} .c-oob{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px);opacity:.6}
.fA{fill:var(--st-awake)} .fL{fill:var(--st-light)} .fD{fill:var(--st-deep)} .fO{fill:var(--muted);opacity:.16}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
svg .grid{stroke:var(--line);stroke-width:1}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.night{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.6fr) auto;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.night:last-child{border-bottom:0}
.night:hover .nd{color:var(--accent)}
@media (max-width:640px){.night{grid-template-columns:minmax(0,1fr) auto}.night .nb{grid-column:1/-1;order:3}.night .nt{display:none}}
.score{position:relative;width:46px;height:46px;flex:none}
.score svg{width:100%;height:100%;transform:rotate(-90deg)}
.score b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:600}
.score.lg{width:112px;height:112px}
.score.lg b{font-size:32px}
.stagelist{display:flex;flex-direction:column;gap:12px}
.stagelist .r{display:grid;grid-template-columns:70px minmax(0,1fr) 72px;gap:12px;align-items:center;font-size:14px}
.stagelist .track{height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.stagelist .track i{display:block;height:100%;border-radius:5px}

/* auth */
.auth{min-height:calc(100vh - var(--bar));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth .art{background:var(--panel);border-right:1px solid var(--line);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:30px;overflow:hidden}
.auth .art h2{font-size:clamp(26px,3vw,38px);line-height:1.15;letter-spacing:-.03em;max-width:15ch}
.auth .side-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){.auth{grid-template-columns:minmax(0,1fr)}.auth .art{display:none}}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* claim / register */
.scan{position:relative;width:100%;max-width:300px;aspect-ratio:1;border-radius:18px;background:var(--bg);border:1px solid var(--line);margin:0 auto;display:grid;place-items:center;overflow:hidden}
.scan .c{position:absolute;width:42px;height:42px;border:3px solid var(--live)}
.scan .c1{top:18px;left:18px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.scan .c2{top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.scan .c3{bottom:18px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.scan .c4{bottom:18px;right:18px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scan .ln{position:absolute;left:30px;right:30px;height:2px;background:var(--live);top:50%;animation:scan 2.2s ease-in-out infinite alternate;opacity:.8}
@keyframes scan{from{top:22%}to{top:78%}}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.stepper .s{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;background:var(--panel-2)}
.stepper .s b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:12px}
.stepper .s.on{color:var(--ink)} .stepper .s.on b{background:var(--accent);color:var(--accent-ink)}
.stepper .s.done b{background:var(--ok);color:var(--accent-ink)}
/* sticker is printed on white paper, so it is white in both themes */
.sticker{background:#ffffff;color:#000000;border-radius:12px;padding:16px;display:flex;gap:16px;align-items:center;max-width:420px;border:1px dashed var(--muted)}
.sticker canvas{width:132px;height:132px;image-rendering:pixelated;flex:none}
.sticker .mono{font-size:12.5px;line-height:1.7}
@media (max-width:400px){.sticker{flex-direction:column;align-items:flex-start}}
.term{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.7;max-height:220px;overflow:auto;white-space:pre}
.progress{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:14px}

   one character per 5 min, D deep, L light, A awake, O out of bed (see docs/DEVICE-DATA.md).
   The server groups sessions into a night: gaps under 30 min merge, noon cut-off in the device
   time zone, longest group = main sleep, other groups = naps, sessions under 25 min hidden. */
let PLATFORM={mergeGap:30,minSession:25,cutoff:'12:00'};
function genHyp(r,steps){
  const seg=[];const onset=2+Math.floor(r()*4);
  for(let k=0;k<onset;k++) seg.push('A');
  let c=0;
  while(seg.length<steps){
    const plan=[['L',4+Math.floor(r()*3)],['D',Math.max(0,8-c*2+Math.floor(r()*3))],['L',3+c+Math.floor(r()*3)]];
    if(r()<.45) plan.push(['A',1+Math.floor(r()*2)]);
    if(r()<.1) plan.push(['O',1+Math.floor(r()*2)]);
    for(const [s,n] of plan) for(let k=0;k<n;k++) seg.push(s);
    c++;
  }
  seg.length=steps; seg[steps-1]='A';
  return seg.join('');
}
const NIGHTS={};
function nightsFor(id){
  if(NIGHTS[id]) return NIGHTS[id];
  const out=[];
  for(let i=0;i<14;i++){
    const r=rng(hash(id)+i*977);
    const d=new Date(2026,10,2-i);
    const bed=22*60+40+Math.floor(r()*70);
    const len=390+Math.floor(r()*90);
    let sessions=[{start:bed,end:bed+len}];
    if(i===0||r()<.3){ // got up in the night for 10-25 min: two sessions, merged into one night
      const cut=Math.round(len*(.35+r()*.3)/5)*5, gap=10+Math.floor(r()*4)*5;
      sessions=[{start:bed,end:bed+cut},{start:bed+cut+gap,end:bed+len}];
    }
    sessions.forEach(s=>s.hyp=genHyp(r,Math.round((s.end-s.start)/5)));
    let tl='';
    sessions.forEach((s,k)=>{if(k) tl+='O'.repeat(Math.round((s.start-sessions[k-1].end)/5)); tl+=s.hyp});
    const cnt={D:0,L:0,A:0,O:0}; tl.split('').forEach(ch=>cnt[ch]++);
    const mins={D:cnt.D*5,L:cnt.L*5,A:cnt.A*5,O:cnt.O*5};
    const span=sessions[sessions.length-1].end-bed, inBed=span-mins.O, total=mins.D+mins.L;
    let wake=0; for(let k=6;k<tl.length-1;k++) if(tl[k]==='A'&&tl[k-1]!=='A') wake++;
    let exits=0; for(let k=1;k<tl.length;k++) if(tl[k]==='O'&&tl[k-1]!=='O') exits++;
    const score=Math.max(42,Math.min(96,Math.round(28+total/9+mins.D/7-wake*4)));
    const nap=(i===1||r()<.25)?(()=>{const s=14*60+Math.floor(r()*12)*10,l=30+Math.floor(r()*5)*10;return {start:s,end:s+l,hyp:genHyp(r,l/5)}})():null;
    const hrAvg=54+Math.floor(r()*9), brAvg=12+Math.floor(r()*4);
    out.push({i,date:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),bed,wakeAt:bed+span,span,inBed,sessions,tl,mins,total,wake,exits,score,nap,
      hrAvg,hrMin:hrAvg-6-Math.floor(r()*3),hrMax:hrAvg+14+Math.floor(r()*10),brAvg,brMin:brAvg-3,brMax:brAvg+4+Math.floor(r()*3),
      turns:9+Math.floor(r()*18),bigMv:3+Math.floor(r()*6),smallMv:14+Math.floor(r()*12),apnea:r()<.2?1:0,struggles:0,eff:Math.round(total/inBed*100)});
  }
  return NIGHTS[id]=out;
}

function spark(vals,min,max,col,w=300,h=46){const n=vals.length;const pts=vals.map((v,i)=>`${(i/(n-1)*w).toFixed(1)},${(h-3-(v-min)/(max-min)*(h-6)).toFixed(1)}`).join(' ');

/* hypno(timeline string, start minute): 3 stage rows; out-of-bed time (inside a session or
   between merged sessions) is a shaded full-height band */
function hypno(tl,start){
  const W=680,H=180,L=58,R=12,T=10,B=30,rh=(H-T-B)/3,ROW={A:0,L:1,D:2};
  const X=i=>L+(W-L-R)*i/tl.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep stages through the night">`;
  ['Awake','Light','Deep'].forEach((lab,k)=>{const y=T+rh*k+rh/2;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke-dasharray="2 4"/><text x="${L-10}" y="${y+4}" text-anchor="end">${lab}</text>`});
  let i=0;while(i<tl.length){let j=i;while(j<tl.length&&tl[j]===tl[i])j++;const st=tl[i],x=X(i).toFixed(1),w=Math.max(1,X(j)-X(i)-.6).toFixed(1);
    if(st==='O'){s+=`<rect class="fO" x="${x}" y="${T}" width="${w}" height="${H-T-B}" rx="2"/>`;if(j-i>=3)s+=`<text x="${(X(i)+X(j))/2}" y="${T+12}" text-anchor="middle">out of bed</text>`}
    else s+=`<rect class="f${st}" x="${x}" y="${(T+rh*ROW[st]+rh*.2).toFixed(1)}" width="${w}" height="${(rh*.6).toFixed(1)}" rx="2"/>`;i=j}
  const end=start+tl.length*5,step=tl.length>36?60:15;
  for(let h=Math.ceil(start/step)*step;h<end;h+=step){const x=X((h-start)/5);s+=`<line class="grid" x1="${x}" x2="${x}" y1="${T}" y2="${H-B+4}"/><text x="${x}" y="${H-10}" text-anchor="middle">${hm(h)}</text>`}
  return s+'</svg>';
}
function barChart(vals,labels,maxV,ticks,fmt,col,hi){
  const W=680,H=210,L=40,R=10,T=12,B=30,n=vals.length,bw=(W-L-R)/n;
  const Y=v=>T+(H-T-B)*(1-v/maxV);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${fmt(t)}</text>`});
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.18;s+=`<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="3" fill="${col}" opacity="${i===hi?1:.55}"/>`;
    if(labels[i]) s+=`<text x="${(x+bw*.32).toFixed(1)}" y="${H-10}" text-anchor="middle">${labels[i]}</text>`});
  return s+'</svg>';
}
function drawQR(cv,text){const N=25,r=rng(hash(text)),ctx=cv.getContext('2d');cv.width=N+4;cv.height=N+4;ctx.fillStyle='#fff';ctx.fillRect(0,0,N+4,N+4);ctx.fillStyle='#000';
  const fin=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||j===0||i===6||j===6||(i>1&&i<5&&j>1&&j<5);if(e)ctx.fillRect(x+i+2,y+j+2,1,1)}};
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const inF=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);if(!inF&&r()<.48)ctx.fillRect(i+2,j+2,1,1)}
  fin(0,0);fin(N-7,0);fin(0,N-7)}

SCREENS['c-history']=()=>{const list=myDevices();const id=S.histDev&&list.some(d=>d.id===S.histDev)?S.histDev:list[0].id;S.histDev=id;

 return `<div class="wrap">${head('Sleep history'+tzTag(d),'One card per night. Trends count the main sleep only, not naps.')}
 ${list.length>1?`<div class="seg">${list.map(x=>`<button class="${x.id===id?'on':''}" data-act="histDev" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>`:''}

  <div class="card tile"><span class="label">Avg sleep</span><div class="v">${dur(Math.round(N.reduce((a,n)=>a+n.total,0)/N.length))}</div></div>
  <div class="card tile"><span class="label">Avg score ${PH}</span><div class="v">${Math.round(N.reduce((a,n)=>a+n.score,0)/N.length)}<small>/100</small></div></div>
  <div class="card tile"><span class="label">Avg heart rate</span><div class="v">${Math.round(N.reduce((a,n)=>a+n.hrAvg,0)/N.length)}<small>bpm</small></div></div>
  <div class="card tile"><span class="label">Wake-ups / night</span><div class="v">${(N.reduce((a,n)=>a+n.wake,0)/N.length).toFixed(1)}</div></div>

  <div class="chartbox">${barChart(rev.map(n=>n.total/60),rev.map((n,i)=>i%2===1?n.date.split(' ')[1]+' '+n.date.split(' ')[2]:''),10,[0,2,4,6,8,10],v=>v+'h','var(--st-light)',13)}</div></div>

  ${N.map(n=>`<div class="night" data-go="c-night" data-night="${n.i}"><div class="stack" style="gap:2px"><b class="nd">${n.date}</b><span class="xs muted">${hm(n.bed)} → ${hm(n.wakeAt)}</span>
   ${n.sessions.length>1||n.nap?`<span class="chips">${n.sessions.length>1?`<span class="pill xs">${n.sessions.length} sessions</span>`:''}${n.nap?`<span class="pill acc xs">+ nap ${n.nap.end-n.nap.start}m</span>`:''}</span>`:''}</div>
   <div class="nt small"><b>${dur(n.total)}</b><span class="muted"> asleep</span></div><div class="nb">${stageBar(n)}</div>${scoreRing(n.score)}</div>`).join('')}
 </div></div>`};

SCREENS['c-night']=()=>{const d=dev(S.histDev||S.dev),n=nightsFor(d.id)[S.night];

  <div class="stack" style="gap:4px;flex:1;min-width:200px"><span class="label">Sleep score ${PH}</span><h2 style="font-size:22px">${n.score>=80?'A good night':n.score>=65?'A fair night':'A restless night'}</h2><p class="muted small">${dur(n.total)} asleep out of ${dur(n.inBed)} in bed, woke ${n.wake} time${n.wake===1?'':'s'}${n.exits?`, got up ${n.exits} time${n.exits===1?'':'s'}`:''}.</p></div></div></div>
 <div class="tiles">

 </div>
 <div class="card"><div class="ch"><div class="t"><h2>Sleep stages</h2><span class="xs muted">Main sleep, ${n.sessions.length} session${n.sessions.length===1?'':'s'} joined · each block is 5 minutes</span></div>${legend}</div><div class="chartbox">${hypno(n.tl,n.bed)}</div></div>

  <div class="card"><h2 style="margin-bottom:14px">Sessions</h2><div class="stack" style="gap:10px">
   ${n.sessions.map((s,k)=>`${k?`<div class="row xs muted" style="padding-left:12px">${ic('person',14)} Out of bed ${s.start-n.sessions[k-1].end} min · joined because the gap is under ${PLATFORM.mergeGap} min</div>`:''}<div class="between"><span class="small"><b>${hm(s.start)} → ${hm(s.end)}</b></span><span class="small muted">${dur(s.end-s.start)}</span></div>`).join('')}
   ${n.nap?`<div class="divider"></div><div class="between"><span class="small"><span class="pill acc">Nap</span> <b>${hm(n.nap.start)} → ${hm(n.nap.end)}</b></span><span class="small muted">${n.nap.end-n.nap.start} min</span></div><p class="xs muted">Naps are shown here but not counted in the totals or trends.</p>`:''}
  </div></div>
 </div>
 <div class="card"><h2 style="margin-bottom:14px">Body during sleep ${PH}</h2><div class="g2" style="gap:9px 32px"><dl class="kv">

   <dt>Breath rate avg</dt><dd class="num">${n.brAvg} /min</dd><dt>Breath rate min / max</dt><dd class="num">${n.brMin} / ${n.brMax} /min</dd>
   <dt>Apnea events</dt><dd class="num">${n.apnea}</dd></dl><dl class="kv">
   <dt>Turn-overs</dt><dd class="num">${n.turns}</dd><dt>Large / small movement</dt><dd class="num">${n.bigMv}% / ${n.smallMv}%</dd>
   <dt>Bed exits</dt><dd class="num">${n.exits}</dd><dt>Abnormal struggle</dt><dd class="num">${n.struggles}</dd></dl></div></div>
 </div>`};

/* Invites: phone numbers are not verified (no SMS OTP), so an invite is accepted only by opening
   its link (one-time token, 7 days). It is never matched to a phone number at sign-up or login. */
function linkCard(inv,who){return `<div class="card stack" style="gap:12px;border-color:var(--accent)"><div class="stack" style="gap:2px"><h2>Invite link for ${esc(inv.name)}</h2><span class="xs muted">${who}</span></div>
  <div class="row" style="flex-wrap:nowrap"><input class="inp mono" id="inv-url" value="${inv.url}" readonly style="min-width:0"><button class="btn" data-act="copyLink" data-url="${inv.url}">Copy link</button></div>
  <p class="hint">Send it to them yourself, on WhatsApp, SMS or email. Anyone who opens it can accept, so send it only to that person. It works once and expires in 7 days.</p>
  <button class="link small" style="align-self:flex-start" data-act="closeLink">Done</button></div>`}
SCREENS['c-share']=()=>{const d=dev(S.dev),list=SHARES[d.id]||(SHARES[d.id]=[]);

 ${S.newLink?linkCard(S.newLink,'Opens a page where they accept with their own Argus account, or create one.'):''}
 ${S.invite?`<div class="card"><h2 style="margin-bottom:14px">Invite a family member</h2><form class="form" data-submit="inviteSend">
   <div class="field"><label for="iv-name">Who is it for?</label><input class="inp" id="iv-name" placeholder="e.g. Anita Shah"><span class="hint">Only a label for your list. You get a link to send them.</span></div>
   <div><span class="label">What they can do</span>${permToggles(FAM_PERMS,['live.view','history.view','alerts.receive'],'iv-perm')}</div>

 <div class="card">
  <div class="person"><div class="avatar">PS</div><div class="stack" style="gap:2px;flex:1;min-width:0"><b>Priya Shah <span class="pill acc" style="margin-left:4px">Owner</span></b><span class="xs muted">+91 98250 12345 · can do everything</span></div></div>
  ${list.map((s,i)=>{const pend=s.status!=='Joined';return `<div class="person"><div class="avatar">${initials(s.name)}</div><div class="stack" style="gap:6px;flex:1;min-width:0">

    :`<button class="btn ghost sm" data-act="editShare" data-i="${i}">${S.editShare===i?'Done':'Edit'}</button>`}</div>
   ${S.editShare===i?`<div>${permToggles(FAM_PERMS,s.perms,'sh-'+i)}</div><button class="btn danger sm" style="align-self:flex-start" data-act="removeShare" data-i="${i}">Remove access</button>`
    :`<div class="chips">${s.perms.map(p=>`<span class="pill">${FAM_PERMS.find(f=>f[0]===p)[1]}</span>`).join('')}</div>`}

  <div class="field"><label for="ti-role">Role</label><select class="inp" id="ti-role">${roles.filter(r=>r!=='Owner').map(r=>`<option>${r}</option>`).join('')}</select></div></div>
  <div class="row"><button class="btn" type="submit">Create invite link</button><button class="btn ghost" type="button" data-act="teamInvite">Cancel</button></div></form></div>`:''}
 ${TEAM_INVITES.length?`<div class="card"><h2 style="margin-bottom:8px">Open invites</h2>${TEAM_INVITES.map((t,i)=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div class="stack" style="gap:0"><b class="small">${esc(t.name)} · ${t.role}</b><span class="xs muted">Link not opened yet · expires ${t.expires}</span></div><div class="row" style="gap:6px"><button class="btn ghost sm" data-act="copyLink" data-url="${t.url}">Copy link</button><button class="btn danger sm" data-act="cancelTeamInvite" data-i="${i}">Cancel</button></div></div>`).join('')}</div>`:''}
 <div class="card"><h2 style="margin-bottom:12px">Members</h2><div class="tbl"><table><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Last active</th></tr></thead><tbody>
  ${TEAM.map((m,i)=>`<tr><td><b>${m.name}</b></td><td class="mono">${m.phone}</td><td><select class="inp sm" data-act="teamRole" data-i="${i}" aria-label="Role for ${m.name}" ${m.role==='Owner'?'disabled':''}>${roles.map(r=>`<option ${r===m.role?'selected':''}>${r}</option>`).join('')}</select></td><td class="muted">${m.active}</td></tr>`).join('')}
 </tbody></table></div></div>
 <div class="card"><div class="ch"><div class="t"><h2>Roles</h2><span class="xs muted">Switch a permission on or off for a whole role. Owner always has everything.</span></div><button class="btn ghost sm" data-act="toast" data-msg="New role added. Give it a name and switch on its permissions.">${ic('plus',16)} Add role</button></div>
 <div class="tbl"><table class="matrix"><thead><tr><th>Permission</th>${roles.map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>
  ${ADMIN_PERMS.map(([k,l])=>`<tr><td><span>${l}</span><br><span class="xs muted mono">${k}</span></td>${roles.map(r=>`<td><input type="checkbox" class="sw" data-act="rolePerm" data-r="${r}" data-p="${k}" aria-label="${l} for ${r}" ${ROLES[r].includes(k)?'checked':''} ${r==='Owner'?'disabled':''}></td>`).join('')}</tr>`).join('')}
 </tbody></table></div></div>
 <div class="note">${ic('shield')}<span>Customers use the same system when they share a sensor with family: a list of permissions, switched on per person. Try “View as Kiran” to see a Manufacturing view.</span></div>
 </div>`};

SCREENS['a-audit']=()=>{const q=S.auditQ.toLowerCase(),a=S.auditA;const rows=AUDIT.filter(r=>(a==='all'||r[2].startsWith(a))&&(!q||r.join(' ').toLowerCase().includes(q)));
 return `<div class="wrap">${head('Audit log','Every change by staff or customers, newest first. Entries cannot be edited.')}
 <div class="card"><div class="toolbar"><input class="inp" id="au-q" placeholder="Search person, device, detail" value="${esc(S.auditQ)}" data-act="auditQ"><select class="inp" id="au-a" data-act="auditA">${[['all','All actions'],['device','Devices'],['ota','OTA'],['firmware','Firmware'],['share','Sharing'],['customer','Customers'],['team','Team']].map(([v,l])=>`<option value="${v}" ${a===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="tbl"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td class="muted">${r[0]}</td><td>${r[1]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td><td class="muted">${r[4]}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nothing matches.</td></tr>'}
 </tbody></table></div></div></div>`};

SCREENS['a-settings']=()=>{const ex=nightsFor('ARG-24A0012')[0];
 return `<div class="wrap narrow">${head('Sleep rules','How device sessions are grouped into nights. Applies to every device.')}
 <div class="card"><h2 style="margin-bottom:14px">Grouping sessions into a night</h2><form class="form" data-submit="platformSave">
  <div class="fields2"><div class="field"><label for="ps-gap">Join sessions less than this apart</label><div class="row" style="flex-wrap:nowrap"><input class="inp num" id="ps-gap" type="number" min="0" value="${PLATFORM.mergeGap}" style="max-width:110px"><span class="muted">min</span></div><span class="hint">Getting up for the bathroom shouldn't split the night in two.</span></div>
  <div class="field"><label for="ps-min">Hide sessions shorter than</label><div class="row" style="flex-wrap:nowrap"><input class="inp num" id="ps-min" type="number" min="0" value="${PLATFORM.minSession}" style="max-width:110px"><span class="muted">min</span></div><span class="hint">Short sessions are still stored, just not shown in history or trends.</span></div>
  <div class="field"><label for="ps-cut">New devices start a new night at</label><input class="inp" id="ps-cut" type="time" value="${PLATFORM.cutoff}" style="max-width:160px"><span class="hint">In the device's own time zone. Customers can change it per device.</span></div></div>
  <button class="btn" type="submit" style="align-self:flex-start">Save rules</button></form></div>
 <div class="card"><h2 style="margin-bottom:12px">How it works</h2><div class="stack small" style="gap:8px">
  <p>1. Every time someone gets into bed and out again, the sensor sends one <b>session</b>.</p>
  <p>2. Sessions on the same date (cut off at the time above) that are less than ${PLATFORM.mergeGap} min apart are joined. The gap shows as “out of bed”.</p>
  <p>3. The longest joined group is the <b>main sleep</b>. Any other group is a <b>nap</b>: it gets a badge but doesn't count in trends.</p></div>
  <div class="chartbox" style="margin-top:14px">${hypno(ex.tl,ex.bed)}</div><p class="xs muted">Example: Mom's bedroom, ${ex.date}, ${ex.sessions.length} sessions joined.</p></div>
 </div>`};

/* ---------- render ---------- */
/* unread in-app alerts: the count on the bell (v1 alerts are in-app only) */
const badge=n=>n.id==='c-alerts'&&S.unread?`<span class="badge" aria-label="${S.unread} new alerts">${S.unread}</span>`:'';
function renderShell(){
  const u=P(),nav=navFor(),active=PARENT[S.screen]||S.screen;
  if(!u||S.screen==='login'||S.screen==='signup'||S.screen==='accept'){return (SCREENS[S.screen]||SCREENS.login)()}
  let body;
  const need=SCREEN_PERM[S.screen];const kindOk=S.screen[0]===(u.kind==='admin'?'a':'c');
  if(!SCREENS[S.screen]||!kindOk) body=locked('This screen belongs to the '+(u.kind==='admin'?'customer':'admin')+' side.');
  else if(need&&!can(need)) body=locked();
  else if(S.screen==='c-claim'&&!u.owner) body=locked('Only the owner of an account can add devices.');
  else if(u.kind==='customer'&&!myDevices().length&&S.screen!=='c-devices'&&S.screen!=='c-profile'&&S.screen!=='c-claim') body=SCREENS['c-devices']();
  else body=SCREENS[S.screen]();
  const max=4,tabs=nav.length>5?nav.slice(0,max):nav,rest=nav.length>5?nav.slice(max):[];
  return `<div class="shell">
  <aside class="side"><span class="label sec">${u.kind==='admin'?'Admin · '+u.role:'My home'}</span>
   ${nav.map(n=>`<button class="nav ${active===n.id?'on':''}" data-go="${n.id}">${ic(n.icon,20)}<span>${n.label}</span>${badge(n)}</button>`).join('')}
   <div class="foot"><div class="who small"><b>${u.name}</b><span class="xs muted">${u.phone}</span></div><button class="btn ghost sm" data-act="logout">${ic('out',16)} Log out</button></div>
  </aside>
  <main class="main">${body}</main></div>
  <nav class="tabbar">${tabs.map(n=>`<button class="${active===n.id?'on':''}" data-go="${n.id}">${ic(n.icon,22)}<span>${n.label}</span>${badge(n)}</button>`).join('')}${rest.length?`<button class="${rest.some(n=>n.id===active)?'on':''}" data-act="more">${ic('more',22)}<span>More</span></button>`:''}</nav>
  ${S.more?`<div class="scrim" data-act="more"></div><div class="sheet"><div class="grab"></div>${rest.map(n=>`<button class="nav ${active===n.id?'on':''}" data-go="${n.id}">${ic(n.icon,20)}<span>${n.label}</span></button>`).join('')}<div class="divider"></div><button class="nav" data-act="logout">${ic('out',20)}<span>Log out</span></button></div>`:''}`;
}
function render(){
  stopLive();
  $('#app').innerHTML=renderShell();
  $('#persona').value=P()?S.persona:(S.screen==='accept'?'inv-'+S.acceptKind:'out');
  if(S.screen==='c-live') startLive();
  if(S.screen==='a-register'&&S.reg.step===3){const c=$('#qr');if(c) drawQR(c,S.reg.serial)}
  try{history.replaceState(null,'','#'+S.screen)}catch(e){}
}
function go(id,el){
  if(el){if(el.dataset.dev){S.dev=el.dataset.dev;S.histDev=el.dataset.dev}if(el.dataset.night!==undefined)S.night=+el.dataset.night;if(el.dataset.cust)S.cust=el.dataset.cust}
  if(id==='c-alerts')S.unread=0;
  if(id!==S.screen){S.pendingCmd=null;S.forgot=false;S.invite=false;S.editShare=null;S.newRollout=false;S.newLink=null;S.teamInvite=false}
  S.screen=id;S.more=false;render();window.scrollTo(0,0);
}

/* ---------- fake live stream (stands in for Socket.IO) ---------- */
let liveT=null;const LH={hr:[],br:[]};
function startLive(){const d=dev(S.dev);if(!d.online) return;
  LH.hr=[];LH.br=[];const r=rng(hash(d.id));let hr=d.hr,br=d.br,mv=d.move;
  for(let i=0;i<40;i++){LH.hr.push(hr+Math.round((r()-.5)*4));LH.br.push(br+Math.round((r()-.5)*2))}
  const draw=()=>{const a=$('#lv-hr-sp'),b=$('#lv-br-sp');if(a)a.innerHTML=spark(LH.hr,d.hr-12,d.hr+12,'var(--bad)');if(b)b.innerHTML=spark(LH.br,d.br-6,d.br+6,'var(--live)')};draw();
  liveT=setInterval(()=>{hr=Math.max(d.hr-8,Math.min(d.hr+8,hr+Math.round((Math.random()-.5)*3)));br=Math.max(d.br-3,Math.min(d.br+3,br+Math.round((Math.random()-.5)*1.4)));
   mv=Math.max(0,Math.min(100,Math.round(mv*.7+(Math.random()<.15?Math.random()*40:Math.random()*6))));
   LH.hr.push(hr);LH.hr.shift();LH.br.push(br);LH.br.shift();
   const set=(id,v)=>{const e=$(id);if(e)e.textContent=v};set('#lv-hr',hr);set('#lv-br',br);set('#lv-mv',mv);set('#lv-mv-t',mv<10?'Still':mv<35?'Small movements':'Moving a lot');
   const m=$('#lv-mv-m');if(m)m.style.width=mv+'%';set('#lv-rssi',(d.rssi+Math.round((Math.random()-.5)*4))+' dBm');draw()},2000)}
function stopLive(){if(liveT){clearInterval(liveT);liveT=null}}

/* ---------- actions ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}
const ACT={
 toast:el=>toast(el.dataset.msg),
 logout:()=>{S.persona='out';S.signupStep=1;go('login')},
 more:()=>{S.more=!S.more;render()},
 signupNext:()=>{S.signupStep++;render()},
 signupDone:()=>{S.persona='priya';S.signupStep=1;go('c-devices');toast('Welcome to Argus')},
 histDev:el=>{S.histDev=el.dataset.id;render()},
 night:el=>{S.night=Math.max(0,Math.min(13,S.night+ +el.dataset.dir));render()},
 claimTab:el=>{S.claimTab=el.dataset.t;S.scanState='idle';render()},
 scan:()=>{S.scanState='on';render();setTimeout(()=>{if(S.screen==='c-claim'&&S.scanState==='on'){S.scanState='idle';S.claimStep=2;render();toast('Sticker read: ARG-24A0031')}},2200)},
 claimBack:()=>{S.claimStep=1;render()},
 invite:()=>{S.invite=!S.invite;S.newLink=null;render()},
 teamInvite:()=>{S.teamInvite=!S.teamInvite;S.newLink=null;render()},
 closeLink:()=>{S.newLink=null;render()},
 forgot:()=>{S.forgot=!S.forgot;render()},
 cancelTeamInvite:el=>{const t=TEAM_INVITES.splice(+el.dataset.i,1)[0];render();toast('Invite for '+t.name+' cancelled. The link no longer works.')},
 copyLink:el=>{const u=el.dataset.url;const done=()=>toast('Link copied. Paste it into WhatsApp, SMS or email.');
   try{navigator.clipboard.writeText(u).then(done,()=>{const i=$('#inv-url');if(i){i.select()}toast('Select the link and copy it')})}catch(e){toast('Select the link and copy it')}},
 acceptInvite:()=>{const staff=S.acceptKind==='staff';S.pendingInvite=null;if(staff){S.persona='devam';go('a-dash');toast('You joined the Argus team as Support')}else{if(!P()||P().kind!=='customer')S.persona='rohan';go('c-devices');toast("Mom's bedroom added to your devices")}},
 logoutKeepInvite:()=>{S.persona='out';S.pendingInvite=S.acceptKind;render()},
 editShare:el=>{const i=+el.dataset.i;if(S.editShare===i){const s=SHARES[S.dev][i];s.perms=[...document.querySelectorAll(`input[name="sh-${i}"]:checked`)].map(x=>x.value);toast('Access updated for '+s.name);S.editShare=null}else S.editShare=i;render()},
 removeShare:el=>{const s=SHARES[S.dev].splice(+el.dataset.i,1)[0];S.editShare=null;render();toast(s.status==='Joined'?s.name+' no longer has access':'Invite cancelled. The link no longer works.')},
 alertTab:el=>{S.alertTab=el.dataset.t;render()},
 themeSw:()=>setTheme(S.theme==='dark'?'light':'dark'),
 cmd:el=>{S.pendingCmd=el.dataset.c;render()},
 cmdCancel:()=>{S.pendingCmd=null;render()},
 cmdSend:()=>{const d=dev(S.dev),c=S.pendingCmd,entry={c,by:P().name,t:'3 Nov, now',s:d.online?'Sent':'Queued',fresh:true};CMDLOG[d.id].unshift(entry);S.pendingCmd=null;render();toast(d.online?c+' sent to '+d.id:c+' queued until the device is back online');
   if(d.online) setTimeout(()=>{entry.s='Done';if(S.screen==='a-device')render();toast(d.id+' finished '+c)},2000)},
 usbRead:()=>{S.reg.reading=true;render();setTimeout(()=>{Object.assign(S.reg,{reading:false,step:2,mac:'34:85:18:A1:18:'+['1A','2F','3C','47'][Math.floor(Math.random()*4)],chip:'ESP32-S3'});if(S.screen==='a-register')render()},1800)},
 regReset:()=>{S.reg={step:1,reading:false,mac:'',chip:'',serial:'',code:''};render()},
 newRollout:()=>{S.newRollout=!S.newRollout;render()},
 rolePerm:el=>{const r=el.dataset.r,p=el.dataset.p,set=new Set(ROLES[r]);el.checked?set.add(p):set.delete(p);ROLES[r]=[...set];toast(`${r}: ${p} ${el.checked?'on':'off'}`);render()},
 teamRole:el=>{TEAM[+el.dataset.i].role=el.value;toast(TEAM[+el.dataset.i].name+' is now '+el.value)},
};
const SUBMIT={
 login:()=>{if(S.pendingInvite){S.persona=S.pendingInvite==='staff'?'kiran':'rohan';go('accept');return}if(S.persona==='out'||!P())S.persona='priya';go(home())},
 signup1:()=>{if(S.pendingInvite){S.persona=S.pendingInvite==='staff'?'kiran':'rohan';S.signupStep=1;go('accept');return}S.signupStep=2;render()},
 claimType:()=>{S.claimStep=2;render();toast('Found ARG-24A0031')},
 claimDone:()=>{S.claimStep=1;S.scanState='idle';go('c-devices');toast('Device added. Live values appear once it connects.')},
 inviteSend:()=>{const n=$('#iv-name').value.trim()||'Family member';const perms=[...document.querySelectorAll('input[name="iv-perm"]:checked')].map(x=>x.value);
   const url='https://app.argus.example/invite/'+Math.random().toString(36).slice(2,12);
   SHARES[S.dev].push({name:n,phone:'',perms,status:'Pending',expires:'10 Nov',url});S.invite=false;S.newLink={name:n,url};render();toast('Invite link created')},
 teamInviteSend:()=>{const n=$('#ti-name').value.trim()||'Team member',role=$('#ti-role').value;const url='https://app.argus.example/invite/'+Math.random().toString(36).slice(2,12);
   TEAM_INVITES.unshift({name:n,role,expires:'10 Nov',url});S.teamInvite=false;S.newLink={name:n,url};render();toast('Invite link created')},
 saved:()=>toast('Saved'),
 regSave:()=>{const n=33+DEVICES.filter(d=>d.reg==='3 Nov 2026').length;const serial='ARG-24A00'+n;const ch='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<9;i++){code+=ch[Math.floor(Math.random()*ch.length)];if(i===2||i===5)code+='-'}
   Object.assign(S.reg,{step:3,serial,code});DEVICES.push({id:serial,name:'—',room:'—',owner:null,online:false,fw:'1.4.2',chip:S.reg.chip,mac:S.reg.mac,seen:'Never',hr:null,br:null,presence:'—',move:0,stage:'—',rssi:null,reg:'3 Nov 2026',ip:'—',up:'—'});
   AUDIT.unshift(['3 Nov, now',P().name,'device.register',serial,'MAC '+S.reg.mac+' · '+S.reg.chip]);render();toast('Registered '+serial)},
 rollout:()=>{const v=$('#ro-v').value;ROLLOUTS.unshift({id:'R-08',v,target:$('#ro-p').value+'% of devices',by:P().name,started:'3 Nov, now',done:0,dl:3,pending:39,failed:0,state:'Running'});S.newRollout=false;render();toast('Rollout of '+v+' started')},
 platformSave:()=>{PLATFORM.mergeGap=+$('#ps-gap').value;PLATFORM.minSession=+$('#ps-min').value;PLATFORM.cutoff=$('#ps-cut').value;render();toast('Sleep rules saved')},
 fwUpload:()=>{const v=$('#fw-v').value.trim();if(!v){toast('Enter a version number, for example 1.4.4');return}FIRMWARE.unshift({v,ch:$('#fw-ch').value,date:'3 Nov 2026',size:'1.25 MB',sha:'—',devices:0,notes:$('#fw-n').value||'—'});render();toast('Uploaded '+v)},
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g&&!e.target.closest('[data-act]')){e.preventDefault();go(g.dataset.go,g);return}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]&&a.tagName!=='SELECT'&&a.tagName!=='INPUT'){ACT[a.dataset.act](a)}
});
document.addEventListener('change',e=>{if(e.target.id==='s-cc'){const c=$('#s-country');if(c)c.value=COUNTRY_BY_CODE[e.target.value]}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='rolePerm'||a.dataset.act==='teamRole'||a.dataset.act==='themeSw')ACT[a.dataset.act](a);
  if(a.dataset.act==='devSt'){S.devFilter.st=a.value;render()}
  if(a.dataset.act==='auditA'){S.auditA=a.value;render()}
  if(a.dataset.act==='custCountry'){S.custCountry=a.value;render()}
  if(a.dataset.act==='custTz'){S.custTz=a.value;render()}});
document.addEventListener('input',e=>{const a=e.target;const k=a.dataset&&a.dataset.act;if(!k)return;
  const keep=()=>{render();const n=document.getElementById(a.id);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  if(k==='devQ'){S.devFilter.q=a.value;keep()} if(k==='custQ'){S.custQ=a.value;keep()} if(k==='auditQ'){S.auditQ=a.value;keep()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.submit;if(SUBMIT[f])SUBMIT[f]()});

function setTheme(t){S.theme=t;document.documentElement.setAttribute('data-theme',t);$('#themebtn').innerHTML=ic(t==='dark'?'sun':'moon');try{localStorage.setItem('argus-theme',t)}catch(e){}if(S.screen==='c-profile')render();else{const b=$('#brand');b.innerHTML=LOGO(26)+' Argus'}}
$('#persona').addEventListener('change',e=>{const v=e.target.value;if(v.startsWith('inv-')){S.persona='out';S.acceptKind=S.pendingInvite=v.slice(4);go('accept');return}S.persona=v;S.reg.step=1;go(v==='out'?'login':home())});
$('#phbtn').innerHTML=ic('tag');
$('#phbtn').addEventListener('click',()=>{S.ph=!S.ph;document.body.classList.toggle('noph',!S.ph);toast(S.ph?'Placeholder tags shown':'Placeholder tags hidden')});
$('#themebtn').addEventListener('click',()=>setTheme(S.theme==='dark'?'light':'dark'));

/* boot */
(function(){let t='dark';try{t=localStorage.getItem('argus-theme')||'dark'}catch(e){}setTheme(t);$('#brand').innerHTML=LOGO(26)+' Argus';
  const h=(location.hash||'').slice(1);
  if(h){if(h.startsWith('a-')){S.persona='devam'}else if(h==='login'||h==='signup'||h==='accept'){S.persona='out';if(h==='accept')S.pendingInvite='family'}
    if(SCREENS[h]){S.screen=h}}
  if(S.persona==='out'&&S.screen!=='signup'&&S.screen!=='accept')S.screen='login';
  render()})();
</script>
