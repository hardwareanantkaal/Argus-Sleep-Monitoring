# Argus PRODUCTION Mosquitto (go-auth). Devices use TLS on 8883 inside the
# container, published on the host as MQTT_TLS_PORT (default 8884, because the
# water project already uses 8883 on this VPS).
per_listener_settings false
allow_anonymous false
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout

max_keepalive 300
max_queued_messages 200
message_size_limit 4096

# Plain listener: Docker network + 127.0.0.1 on the host only.
listener 1883

# TLS listener for devices. Certs are copied here by deploy/certbot-deploy-hook.sh.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Every login and topic is checked by the backend (routes/mqttAuth.js).
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host backend
auth_opt_http_port 3100
auth_opt_http_getuser_uri /mqtt/user
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_method POST
auth_opt_http_timeout 5
auth_opt_disable_superuser true
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 2
auth_opt_acl_cache_seconds 60
auth_opt_auth_jitter_seconds 0
auth_opt_acl_jitter_seconds 0
