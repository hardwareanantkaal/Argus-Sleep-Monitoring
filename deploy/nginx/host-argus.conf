# HOST Nginx site for Argus (the VPS's own Nginx, shared with the water project).
# Install: sudo cp deploy/nginx/host-argus.conf /etc/nginx/sites-available/argus
#          (replace ARGUS_DOMAIN), then link into sites-enabled and reload.
# certbot --nginx --redirect adds the 443/TLS lines to this file.

map $http_upgrade $argus_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name ARGUS_DOMAIN;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:8090;    # GATEWAY_PORT
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $argus_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
}
