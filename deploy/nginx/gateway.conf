# Gateway Nginx inside the Argus stack (container "gateway").
# Host Nginx → 127.0.0.1:GATEWAY_PORT → here → backend / web.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream argus_backend { server backend:3100; keepalive 16; }
upstream argus_web     { server web:3101;     keepalive 16; }

server {
  listen 80;
  server_tokens off;
  client_max_body_size 8m;   # firmware uploads (ESP32 images are 1-4 MB)

  # The broker auth hook is for Mosquitto only, never the internet.
  location /mqtt { return 404; }

  location /api/ {
    proxy_pass http://argus_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass http://argus_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Firmware downloads for OTA (signed URLs), streamed without buffering.
  location /fw/ {
    proxy_pass http://argus_backend;
    proxy_buffering off;
  }

  location = /health { proxy_pass http://argus_backend; }

  # The old Vercel/Firebase app on this domain installed a service worker that
  # keeps showing the old site from its offline cache. Browsers re-fetch the
  # worker script by itself, so answering its old paths with this tiny worker
  # deletes the old caches, unregisters it and reloads the page into the new
  # site, with nothing for the customer to clear. The new app has no service
  # worker, so nothing else requests these paths.
  location ~ ^/(sw|service-worker|serviceWorker|firebase-messaging-sw)\.js$ {
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
    return 200 'self.addEventListener("install",function(){self.skipWaiting();});self.addEventListener("activate",function(e){e.waitUntil(caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n);}));}).then(function(){return self.registration.unregister();}).then(function(){return self.clients.matchAll({type:"window"});}).then(function(c){c.forEach(function(w){w.navigate(w.url);});}));});';
  }

  location / {
    proxy_pass http://argus_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}
